name: Search Console summary
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Site numbers to check, e.g. 1 3 (blank = all). Never type a site name: inputs are public."
        required: false
permissions:
  contents: read
  id-token: write   # keyless Google login (Workload Identity Federation)
jobs:
  gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
      - run: python3 monitor/gsc.py $SITES
        env:
          SITES: ${{ inputs.sites }}
          SITES_JSON: ${{ secrets.SITES_JSON }}
          GSC_TOKEN: ${{ steps.google.outputs.access_token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
