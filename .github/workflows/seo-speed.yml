name: Weekly SEO and speed report
on:
  schedule:
    - cron: "23 1 * * 1"     # Monday 09:23 MYT
  workflow_dispatch:
    inputs:
      sites:
        description: "Site numbers to check, e.g. 1 3 (blank = all). Never type a site name: inputs are public."
        required: false
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 monitor/seo_speed.py $SITES
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          SITES: ${{ inputs.sites }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
