name: Server down check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: monitor-state   # one writer of the shared state at a time
permissions:
  contents: read
  actions: write             # to delete old state caches
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: state
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - run: python3 monitor/down.py
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: state
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep only the newest state cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key monitor-state- --sort created_at --order desc --limit 100 --json key -q '.[1:][].key' |
            while read -r k; do gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done
